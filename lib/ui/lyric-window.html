<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>歌词</title>
<script src="__BASE__/theme.js" defer></script>
<style>
  :root {
    --text: #eef0f3;
    --muted: #9aa0aa;
    --dim: #6a707a;
    --red: #e5484d;
    --line: rgba(255, 255, 255, 0.12);
    --font: 22px;
    --alpha: 1;
    --surface: rgba(12, 14, 18, 0);
    --shadow: 0 0 18px rgba(0, 0, 0, 0.6), 0 1px 3px rgba(0, 0, 0, 0.75);
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: transparent; }
  body {
    color: var(--text);
    font-family: "Microsoft YaHei UI", "PingFang SC", system-ui, sans-serif;
    -webkit-user-select: none;
    user-select: none;
    overflow: hidden;
  }
  .widget {
    position: relative;
    height: 100%;
    display: flex;
    flex-direction: column;
    background: var(--surface);
    border-radius: var(--radius);
    overflow: hidden;
  }
  html[data-bg='none'] .line { text-shadow: var(--shadow); }

  .grab { height: 22px; flex: none; -webkit-app-region: drag; cursor: grab; }
  .stage {
    flex: 1;
    min-height: 0;
    -webkit-app-region: drag;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 0 22px 4px;
    text-align: center;
  }
  .line { max-width: 100%; line-height: 1.45; transition: color 180ms ease, opacity 180ms ease; }
  .line.prev, .line.next { font-size: calc(var(--font) * 0.62); color: var(--muted); opacity: 0.9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .line.now { font-size: var(--font); font-weight: 600; color: var(--text); }
  .line.now.active { color: var(--red); }
  .line.plain { font-size: calc(var(--font) * 0.62); color: var(--muted); }

  .chrome {
    flex: none;
    display: flex;
    align-items: center;
    gap: 6px;
    margin: 0 8px 8px;
    padding: 5px 8px;
    border-radius: 10px;
    background: rgba(12, 14, 18, 0.72);
    border: 1px solid var(--line);
    color: var(--muted);
    font-size: 11px;
    opacity: 0;
    transition: opacity 160ms ease;
    -webkit-app-region: no-drag;
  }
  .widget:hover .chrome, .chrome:focus-within { opacity: 1; }
  .title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .title b { color: var(--text); font-weight: 500; }
  button {
    appearance: none; border: 0; background: rgba(255, 255, 255, 0.07);
    color: var(--text); width: 26px; height: 26px; border-radius: 8px;
    display: inline-flex; align-items: center; justify-content: center; cursor: pointer;
    -webkit-app-region: no-drag; flex: none;
  }
  button:hover { background: rgba(255, 255, 255, 0.15); }
  button.play { background: var(--red); color: #fff; }
  button svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  .tools { display: flex; align-items: center; gap: 6px; flex: none; }
  .tools .sep { width: 1px; height: 16px; background: var(--line); margin: 0 2px; }

  .panel {
    position: absolute; left: 8px; right: 8px; bottom: 44px;
    -webkit-app-region: no-drag;
    background: rgba(10, 12, 16, 0.96);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 10px 12px;
    box-shadow: 0 16px 36px rgba(0, 0, 0, 0.55);
    opacity: 0; pointer-events: none; transform: translateY(6px);
    transition: opacity 160ms ease, transform 160ms ease;
  }
  .panel.pinned { opacity: 1; pointer-events: auto; transform: translateY(0); }
  .panel .row { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 11.5px; color: var(--muted); }
  .panel .row:first-child { margin-top: 0; }
  .panel .row .lab { flex: 0 0 40px; color: var(--dim); }
  .panel .row .val { width: 40px; text-align: right; font-variant-numeric: tabular-nums; color: var(--text); }
  .panel input[type='range'] { flex: 1; min-width: 0; accent-color: var(--red); height: 14px; }
  .panel .seg { display: flex; gap: 4px; }
  .panel .seg button { width: 28px; height: 22px; border-radius: 6px; font-size: 11px; color: var(--muted); }
  .panel .seg button.on { color: var(--text); background: rgba(229, 72, 77, 0.24); }
  .panel .seg button[data-lines], .panel .seg button[data-bg] { width: auto; padding: 0 8px; }
  .lock-badge {
    position: absolute; right: 8px; top: 8px; width: 22px; height: 22px; border-radius: 50%;
    display: none; place-items: center; background: rgba(12, 14, 18, 0.65); border: 1px solid var(--line);
    color: var(--muted); cursor: pointer; -webkit-app-region: no-drag;
  }
  .lock-badge:hover { color: var(--text); }
  .lock-note { display: none; position: absolute; left: 10px; bottom: 6px; font-size: 10px; color: var(--dim); }
  html[data-locked='1'] .widget { background: transparent !important; box-shadow: none !important; }
  html[data-locked='1'] .chrome,
  html[data-locked='1'] .panel {
    opacity: 0 !important; pointer-events: none !important; visibility: hidden;
  }
  html[data-locked='1'] .lock-badge { display: grid; }
  html[data-locked='1'] .grab,
  html[data-locked='1'] .stage { -webkit-app-region: none; cursor: default; }
  html[data-locked='1'] .lock-note { display: block; }
</style>
</head>
<body>
  <div class="widget" id="widget">
    <div class="grab" title="按住拖动"></div>
    <div class="stage" id="stage">
      <div class="line plain" id="msg">正在等播放器…</div>
    </div>
    <div class="chrome" id="chrome">
      <button id="prev" title="上一首" aria-label="上一首"><svg viewBox="0 0 24 24"><path d="M19 20 9 12l10-8z"/><path d="M5 19V5"/></svg></button>
      <button id="play" class="play" title="播放/暂停" aria-label="播放或暂停"><svg viewBox="0 0 24 24" id="playIcon"><path d="M8 5v14l11-7z"/></svg></button>
      <button id="next" title="下一首" aria-label="下一首"><svg viewBox="0 0 24 24"><path d="M5 4l10 8-10 8z"/><path d="M19 5v14"/></svg></button>
      <span class="title" id="title"></span>
      <span class="tools">
        <button id="gear" title="设置" aria-label="设置"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1l2-1.6-2-3.4-2.4 1a7 7 0 0 0-1.7-1L14.4 2h-4.8l-.4 2.6a7 7 0 0 0-1.7 1l-2.4-1-2 3.4L5.1 11a7 7 0 0 0 0 2l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 1.7 1l.4 2.6h4.8l.4-2.6a7 7 0 0 0 1.7-1l2.4 1 2-3.4-2-1.6a7 7 0 0 0 .1-1z"/></svg></button>
        <span class="sep"></span>
        <button id="lock" title="锁定：只留歌词" aria-label="锁定"><svg viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></button>
        <button id="close" title="关闭歌词窗" aria-label="关闭"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </span>
    </div>
    <div class="lock-badge" id="unlock" title="点击解锁" role="button" aria-label="解锁">
      <svg viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
    </div>
    <div class="lock-note">已锁定 · 点右上角解锁</div>
    <div class="panel" id="panel">
      <div class="row"><span class="lab">字号</span>
        <div class="seg"><button type="button" data-font="-2">A−</button><button type="button" data-font="2">A+</button></div>
        <span class="val" id="fontVal">22px</span>
      </div>
      <div class="row"><span class="lab">行数</span>
        <div class="seg" id="lineSeg"><button type="button" data-lines="1">1</button><button type="button" data-lines="3" class="on">3</button><button type="button" data-lines="5">5</button></div>
      </div>
      <div class="row"><span class="lab">背景</span>
        <div class="seg" id="bgSeg"><button type="button" data-bg="none">透明</button><button type="button" data-bg="glass">毛玻璃</button><button type="button" data-bg="card">卡片</button></div>
      </div>
      <div class="row"><span class="lab">文字</span>
        <input type="range" id="alpha" min="45" max="100" step="5" value="100" />
        <span class="val" id="alphaVal">100%</span>
      </div>
    </div>
  </div>
<script>
(function () {
  'use strict';
  var BASE = (window.__NCM_BASE__ || (function () {
    try { return new URLSearchParams(location.search).get('base') || ''; } catch (e) { return ''; }
  })() || (location.pathname.split('/lyric-window')[0] || '')).replace(/\/$/, '');
  var API = BASE + '/api';
  var EMBED = /[?&]embed=1/.test(location.search);
  var state = null;
  var lyrics = null;
  var lines = [];
  var lyricId = null;
  var lastTrackId = null;
  var lastFetchAt = 0;
  var prefs = { font: 22, lines: 3, alpha: 100, locked: false, bg: EMBED ? 'none' : 'card', bgTouched: false };
  try {
    var saved = JSON.parse(localStorage.getItem('ncm-widget') || '{}') || {};
    prefs = Object.assign(prefs, saved);
    /* 内嵌挂件默认必须是透明的：旧的 bg 选择（可能是独立窗时代的 card）不能把它变回黑框。 */
    if (EMBED && !saved.bgTouched) prefs.bg = 'none';
  } catch (e) {}

  function isCapsCredit(text) {
    var t = String(text || '').trim();
    if (!t || /[a-z一-鿿]/.test(t)) return false;
    return /^[A-Z][A-Z .,'&\-]{5,}$/.test(t);
  }
  var CREDIT_LINE = /^\s*(作词|作曲|编曲|制作人|原唱|演唱|监制|混音|母带|录音|吉他|贝斯|鼓|键盘|弦乐|和声|出品|发行|OP|SP)\s*[:：]/i;
  var stage = document.getElementById('stage');
  var msg = document.getElementById('msg');
  var titleEl = document.getElementById('title');
  var panel = document.getElementById('panel');

  function surfaceFor(bg) {
    if (bg === 'glass') return 'rgba(12, 14, 18, 0.62)';
    if (bg === 'card') return 'rgba(12, 14, 18, 0.94)';
    return 'rgba(12, 14, 18, 0)';
  }
  function savePrefs() {
    try { localStorage.setItem('ncm-widget', JSON.stringify(prefs)); } catch (e) {}
  }
  function applyPrefs() {
    var root = document.documentElement;
    root.style.setProperty('--font', prefs.font + 'px');
    root.style.setProperty('--alpha', String(prefs.alpha / 100));
    root.style.setProperty('--surface', prefs.locked ? 'rgba(12, 14, 18, 0)' : surfaceFor(prefs.bg));
    root.dataset.locked = prefs.locked ? '1' : '0';
    root.dataset.bg = prefs.bg;
    document.getElementById('fontVal').textContent = prefs.font + 'px';
    document.getElementById('alpha').value = String(prefs.alpha);
    document.getElementById('alphaVal').textContent = prefs.alpha + '%';
    stage.style.opacity = String(prefs.alpha / 100);
    Array.prototype.forEach.call(document.querySelectorAll('#lineSeg button'), function (b) {
      b.classList.toggle('on', Number(b.getAttribute('data-lines')) === prefs.lines);
    });
    Array.prototype.forEach.call(document.querySelectorAll('#bgSeg button'), function (b) {
      b.classList.toggle('on', b.getAttribute('data-bg') === prefs.bg);
    });
    if (window.parent !== window && EMBED) {
      try { window.parent.postMessage({ type: 'ncm-widget-lock', locked: prefs.locked }, '*'); } catch (e) {}
    }
  }

  function apiGet(path) {
    return fetch(API + path, { cache: 'no-store' }).then(function (res) {
      if (!res.ok) throw new Error('http ' + res.status);
      return res.json();
    });
  }
  function post(path, body) {
    return fetch(API + path, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify(body || {})
    }).catch(function () { /* 遥控失败不打扰 */ });
  }
  function positionMs() {
    if (!state) return 0;
    if (state.playing && state.reported && state.reported.at) {
      return Math.max(0, Number(state.reported.position || 0) + (Date.now() - state.reported.at));
    }
    return Number(state.reported && state.reported.position || 0);
  }
  function lineEl(cls, text) {
    var d = document.createElement('div');
    d.className = 'line ' + cls;
    d.textContent = text || '';
    return d;
  }
  function renderLines() {
    stage.textContent = '';
    if (!state || !state.current) {
      stage.appendChild(lineEl('plain', '播放器里没有在放的歌'));
      titleEl.textContent = '';
      return;
    }
    if (!lines.length) {
      stage.appendChild(lineEl('plain', lyrics ? '这首歌没有时间轴歌词' : '正在取歌词…'));
    } else {
      var pos = positionMs();
      var idx = 0;
      for (var i = 0; i < lines.length; i += 1) {
        if (Number(lines[i].t || 0) <= pos) idx = i;
      }
      if (prefs.lines >= 3) stage.appendChild(lineEl('prev', lines[idx - 1] ? lines[idx - 1].text : ''));
      stage.appendChild(lineEl('now active', lines[idx] ? lines[idx].text : ''));
      if (prefs.lines >= 3) stage.appendChild(lineEl('next', lines[idx + 1] ? lines[idx + 1].text : ''));
      if (prefs.lines >= 5) {
        stage.appendChild(lineEl('next', lines[idx + 2] ? lines[idx + 2].text : ''));
        stage.appendChild(lineEl('next', lines[idx + 3] ? lines[idx + 3].text : ''));
      }
    }
    var name = state.current.name || '';
    titleEl.innerHTML = '';
    var b = document.createElement('b');
    b.textContent = name;
    titleEl.appendChild(b);
    titleEl.appendChild(document.createTextNode(' — ' + (state.current.artists || []).join(' / ')));
    var playing = !!state.playing;
    document.getElementById('playIcon').innerHTML = playing
      ? '<path d="M7 4h4v16H7z"/><path d="M13 4h4v16h-4z"/>'
      : '<path d="M8 5v14l11-7z"/>';
    document.getElementById('play').title = playing ? '暂停' : '播放';
  }
  function ensureLyrics() {
    if (!state || !state.current) return Promise.resolve();
    var id = state.current.id;
    if (id === lyricId && lyrics && lines.length) return Promise.resolve();
    if (id === lyricId && Date.now() - lastFetchAt < 5000) return Promise.resolve();
    lyricId = id;
    lastFetchAt = Date.now();
    lyrics = null;
    lines = [];
    return apiGet('/lyric?id=' + encodeURIComponent(id) + '&mode=lrc')
      .then(function (data) {
        lyrics = data;
        var raw = (data && data.lyrics && data.lyrics.lines) ? data.lyrics.lines : [];
        lines = raw.filter(function (line) { return line && line.text && !CREDIT_LINE.test(line.text); });
        var head = 0;
        while (head < lines.length && isCapsCredit(lines[head].text)) head += 1;
        lines = lines.slice(head);
        renderLines();
      })
      .catch(function () {
        lyrics = {};
        lines = [];
        renderLines();
      });
  }
  function tick() {
    apiGet('/state')
      .then(function (next) {
        state = next;
        if (state.current && state.current.id !== lastTrackId) {
          lastTrackId = state.current.id;
          lyricId = null;
          lyrics = null;
          lines = [];
        }
        renderLines();
        return ensureLyrics();
      })
      .catch(function () { if (msg) msg.textContent = '连不上播放器'; });
  }

  function bind(id, fn) {
    var el = document.getElementById(id);
    if (el) el.addEventListener('click', fn);
  }
  bind('prev', function () { post('/control', { action: 'previous' }); setTimeout(tick, 240); });
  bind('next', function () { post('/control', { action: 'next' }); setTimeout(tick, 240); });
  bind('play', function () { post('/control', { action: 'toggle' }); setTimeout(tick, 240); });
  bind('close', function () {
    if (window.parent !== window) {
      try { window.parent.postMessage({ type: 'ncm-widget-close' }, '*'); } catch (e) {}
    }
    window.close();
  });
  bind('lock', function () { prefs.locked = true; savePrefs(); applyPrefs(); });
  bind('gear', function () { panel.classList.toggle('pinned'); });
  var unlockBtn = document.getElementById('unlock');
  if (unlockBtn) unlockBtn.addEventListener('click', function () { prefs.locked = false; savePrefs(); applyPrefs(); });

  Array.prototype.forEach.call(document.querySelectorAll('[data-font]'), function (b) {
    b.addEventListener('click', function () {
      prefs.font = Math.min(40, Math.max(14, prefs.font + Number(b.getAttribute('data-font'))));
      savePrefs(); applyPrefs();
    });
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-lines]'), function (b) {
    b.addEventListener('click', function () {
      prefs.lines = Number(b.getAttribute('data-lines'));
      savePrefs(); applyPrefs(); renderLines();
    });
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-bg]'), function (b) {
    b.addEventListener('click', function () {
      prefs.bg = b.getAttribute('data-bg');
      prefs.bgTouched = true;
      savePrefs(); applyPrefs();
    });
  });
  document.getElementById('alpha').addEventListener('input', function () {
    prefs.alpha = Number(this.value);
    savePrefs(); applyPrefs();
  });

  applyPrefs();
  tick();
  setInterval(tick, 800);

  window.addEventListener('message', function (event) {
    var data = event.data || {};
    if (data && data.type === 'ncm-widget-unlock') {
      prefs.locked = false;
      savePrefs();
      applyPrefs();
      return;
    }
    if (data && data.type === 'ncm-theme' && data.tokens) {
      Object.keys(data.tokens).forEach(function (name) {
        document.documentElement.style.setProperty(name, data.tokens[name]);
      });
    }
  });
})();
</script>
</body>
</html>
