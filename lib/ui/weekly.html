<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>听歌周报 · 网易云音乐</title>
<style>
  :root{
    --bg:#0F1115; --card:#171A20; --line:#262A33; --text:#E8EAED; --muted:#8B909A;
    --red:#E5484D; --teal:#2FB3A6;
    --r-sm:8px; --r:14px; --r-lg:20px;
    --g1:#E8EAED; --g2:#8B909A; --g3:#5A6070; --g4:#3A3F4A;
  }
  *,*::before,*::after{ box-sizing:border-box; }
  html,body{ margin:0; }
  body{
    min-height:100vh; background:var(--bg); color:var(--text);
    font:14px/1.6 "Microsoft YaHei UI", system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  body::before{
    content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
    background:
      radial-gradient(720px 320px at 78% -12%, rgba(229,72,77,.09), transparent 62%),
      radial-gradient(680px 320px at 6% -8%, rgba(47,179,166,.055), transparent 60%);
  }
  [hidden]{ display:none !important; }
  a{ color:inherit; text-decoration:none; }
  button{ font-family:inherit; }
  .page{ position:relative; z-index:1; width:100%; padding:26px 32px 48px; }

  .top{ display:flex; align-items:center; gap:15px; min-height:44px; }
  .back{
    width:34px; height:34px; flex:0 0 34px; display:grid; place-items:center;
    background:var(--card); border:1px solid var(--line); border-radius:10px; color:var(--muted);
    transition:color .15s, border-color .15s, background .15s;
  }
  .back:hover{ color:var(--text); border-color:#39404d; background:#1b1f27; }
  .back svg{ width:15px; height:15px; display:block; }
  .titles{ min-width:0; }
  h1{ margin:0; font-size:20px; font-weight:600; letter-spacing:.3px; line-height:1.3; }
  .sub{ margin-top:4px; font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .topright{ margin-left:auto; display:flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
  .chip{
    height:30px; padding:0 13px; border-radius:999px; cursor:pointer;
    border:1px solid var(--line); background:transparent; color:var(--muted);
    font-size:12.5px; line-height:1; white-space:nowrap;
    transition:color .15s, border-color .15s, background .15s;
  }
  .chip:hover:not(:disabled){ color:var(--text); border-color:#39404d; }
  .chip.on{ color:var(--text); border-color:rgba(229,72,77,.6); background:rgba(229,72,77,.13); }
  .chip:disabled{ cursor:default; opacity:.55; }
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px; height:30px; padding:0 14px;
    border-radius:999px; font-size:12.5px; cursor:pointer; border:1px solid var(--line);
    background:transparent; color:var(--muted); transition:background .15s, border-color .15s, color .15s;
  }
  .btn:hover:not(:disabled){ color:var(--text); border-color:#39404d; background:#1b1f27; }
  .btn:disabled{ cursor:default; opacity:.55; }
  .btn svg{ width:13px; height:13px; display:block; }
  .btn.solid{ background:var(--red); border-color:var(--red); color:#fff; }
  .btn.solid:hover:not(:disabled){ background:#ef5559; border-color:#ef5559; color:#fff; }

  .card{ background:var(--card); border:1px solid var(--line); border-radius:var(--r); }
  .panel{ padding:17px 18px 16px; min-width:0; }
  .phead{ display:flex; align-items:baseline; gap:8px; margin-bottom:2px; }
  .phead h2{ margin:0; font-size:13.5px; font-weight:600; letter-spacing:.2px; }
  .phead .note{ margin-left:auto; font-size:11px; color:var(--muted); }
  .hint{ font-size:11.5px; color:var(--muted); }

  .stats{ display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px; margin-top:16px; }
  .stat{ padding:16px 18px 15px; position:relative; overflow:hidden; }
  .stat .k{ font-size:11.5px; color:var(--muted); }
  .stat .v{ margin-top:6px; font-size:27px; font-weight:600; line-height:1.15; font-variant-numeric:tabular-nums; letter-spacing:.2px; }
  .stat .v small{ margin-left:4px; font-size:11.5px; font-weight:400; color:var(--muted); letter-spacing:0; }
  .stat .d{ margin-top:6px; font-size:11.5px; color:var(--muted); }
  .stat .d.good{ color:var(--teal); }
  .stat .d.bad{ color:#e0a6a8; }

  .grid2{ display:grid; grid-template-columns:1.45fr 1fr; gap:14px; margin-top:14px; }
  .grid2b{ display:grid; grid-template-columns:1.3fr 1fr; gap:14px; margin-top:14px; }

  /* top tracks */
  .tracks{ margin-top:10px; }
  .trow{ display:flex; align-items:center; gap:11px; padding:8px 0; border-bottom:1px solid rgba(38,42,51,.7); }
  .trow:last-child{ border-bottom:0; }
  .trow .ix{ width:16px; flex:0 0 16px; font-size:11.5px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .cover{ position:relative; width:34px; height:34px; flex:0 0 34px; border-radius:7px; overflow:hidden; background:linear-gradient(140deg,#2c313b,#1b1f27); border:1px solid rgba(255,255,255,.05); }
  .cover img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; }
  .tmeta{ min-width:0; flex:1; }
  .tname{ font-size:12.5px; color:#d6dae1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .trow:first-child .tname{ color:var(--red); }
  .tartist{ margin-top:1px; font-size:11px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tplays{ flex:0 0 auto; font-size:11.5px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .tplays b{ font-weight:500; color:#cdd1d8; }

  /* loop */
  .loop-top{ display:flex; align-items:center; gap:10px; margin-top:12px; }
  .loop-cover{ width:44px; height:44px; flex:0 0 44px; border-radius:9px; }
  .loop-num{ font-size:38px; font-weight:600; line-height:1; font-variant-numeric:tabular-nums; letter-spacing:-.5px; }
  .loop-unit{ margin-left:6px; font-size:11.5px; color:var(--muted); }
  .loop-song{ margin-top:14px; font-size:15px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .loop-artist{ margin-top:3px; font-size:11.5px; color:var(--muted); }
  .loop-story{ margin:13px 0 0; padding-top:12px; border-top:1px solid rgba(38,42,51,.8); font-size:12px; color:var(--muted); line-height:1.9; }
  .loop-empty{ margin-top:18px; padding:26px 10px; text-align:center; border:1px dashed var(--line); border-radius:var(--r-sm); font-size:12px; color:var(--muted); }

  /* week text */
  .wtext{ margin-top:12px; }
  .wtext p{ margin:0 0 11px; font-size:13.5px; line-height:2; color:#c9cdd4; }
  .wtext p:last-child{ margin-bottom:0; }
  .wtext b{ font-weight:500; color:#eeb6b8; }
  .wtext i{ font-style:normal; font-weight:600; color:var(--text); }

  /* daily chart */
  .daychart{ display:flex; align-items:flex-end; gap:8px; height:142px; margin-top:14px; border-bottom:1px solid rgba(38,42,51,.9); padding-bottom:0; }
  .dcol{ flex:1; min-width:0; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:7px; }
  .dval{ font-size:10px; color:var(--muted); font-variant-numeric:tabular-nums; height:12px; line-height:12px; }
  .dbar{ width:100%; max-width:40px; min-height:2px; border-radius:4px 4px 0 0; background:var(--g4); transition:height .35s ease; }
  .dbar.hot{ background:var(--red); }
  .dbar.zero{ background:#343B49; min-height:4px; }
  .daxis{ display:flex; gap:8px; margin-top:8px; }
  .daxis span{ flex:1; text-align:center; font-size:11px; color:var(--muted); }
  .dayfoot{ display:flex; gap:14px; flex-wrap:wrap; margin-top:12px; font-size:11.5px; color:var(--muted); }
  .dayfoot b{ font-weight:500; color:#cdd1d8; }

  .loading{ padding:64px 0; display:flex; flex-direction:column; align-items:center; gap:14px; color:var(--muted); font-size:12.5px; }
  .spinner{ width:22px; height:22px; border-radius:50%; border:2px solid #2b303a; border-top-color:var(--red); animation:spin .9s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .errorbar{
    display:flex; align-items:center; gap:12px; margin-top:14px; padding:10px 12px 10px 14px;
    border:1px solid rgba(229,72,77,.4); background:rgba(229,72,77,.09); border-radius:10px;
    font-size:12.5px; color:#f3c4c6;
  }
  .errorbar .msg{ min-width:0; flex:1; }
  .errorbar button{
    flex:0 0 auto; height:26px; padding:0 12px; border-radius:8px; cursor:pointer;
    border:1px solid rgba(229,72,77,.45); background:rgba(229,72,77,.16); color:#ffd9da; font-size:12px;
  }
  .errorbar button:hover{ background:rgba(229,72,77,.24); }
  .empty{ margin-top:22px; padding:56px 24px; text-align:center; border:1px solid var(--line); border-radius:var(--r-lg); background:var(--card); }
  .empty .glyph{ width:52px; height:52px; margin:0 auto 16px; border-radius:50%; display:grid; place-items:center; border:1px solid var(--line); color:var(--muted); font-size:20px; background:#1b1f27; }
  .empty h2{ margin:0; font-size:16px; font-weight:600; }
  .empty p{ margin:8px auto 20px; max-width:420px; font-size:12.5px; color:var(--muted); line-height:1.8; }
  .empty .btn{ height:34px; padding:0 18px; border-radius:9px; background:#1d2129; color:var(--text); }
  .empty .btn:hover{ background:#232833; border-color:#39404d; }
  .foot{ margin-top:22px; text-align:center; font-size:11px; color:#666c78; letter-spacing:.2px; line-height:1.9; }
  .toast{
    position:fixed; left:50%; bottom:34px; transform:translateX(-50%); z-index:50;
    padding:9px 16px; border-radius:10px; font-size:12.5px; color:var(--text);
    background:#232833; border:1px solid #333a46; box-shadow:0 10px 30px rgba(0,0,0,.45);
    animation:tin .18s ease both;
  }
  @keyframes tin{ from{ opacity:0; transform:translate(-50%,6px); } to{ opacity:1; transform:translate(-50%,0); } }

  @media (max-width:1120px){
    .page{ padding:20px 20px 40px; }
    .stats{ grid-template-columns:repeat(2,minmax(0,1fr)); }
    .grid2,.grid2b{ grid-template-columns:minmax(0,1fr); }
    .top{ flex-wrap:wrap; }
    .topright{ width:100%; margin-left:0; justify-content:flex-start; }
  }
</style>
</head>
<body>
<div class="page">
  <header class="top">
    <a class="back" href="__BASE__/panel" title="返回面板" aria-label="返回面板">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <div class="titles">
      <h1>听歌周报</h1>
      <div class="sub" id="sub">正在读取这一周…</div>
    </div>
    <div class="topright">
      <button class="chip" type="button" data-week="this">本周</button>
      <button class="chip" type="button" data-week="last">上周</button>
      <button class="btn solid" type="button" id="share" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"/><path d="M12 3v12"/><path d="M7 8l5-5 5 5"/></svg>
        分享这张周报
      </button>
    </div>
  </header>

  <div id="error" class="errorbar" role="alert" hidden>
    <span class="msg" id="errorMsg"></span>
    <button type="button" id="retry">重试</button>
  </div>

  <div class="loading" id="loading">
    <div class="spinner"></div>
    <span>正在把这周的歌整理成周报…</span>
  </div>

  <main id="content" hidden>
    <div class="stats">
      <div class="card stat">
        <div class="k">听歌时长</div>
        <div class="v" id="statHours">—<small>小时</small></div>
        <div class="d" id="deltaHours">—</div>
      </div>
      <div class="card stat">
        <div class="k">曲目数</div>
        <div class="v" id="statTracks">—<small>首</small></div>
        <div class="d" id="deltaTracks">—</div>
      </div>
      <div class="card stat">
        <div class="k">新歌</div>
        <div class="v" id="statNew">—<small>首</small></div>
        <div class="d" id="deltaNew">—</div>
      </div>
      <div class="card stat">
        <div class="k">跳过率</div>
        <div class="v" id="statSkip">—<small>%</small></div>
        <div class="d" id="deltaSkip">—</div>
      </div>
    </div>

    <div class="grid2">
      <section class="card panel" aria-label="本周最爱">
        <div class="phead"><h2>本周最爱</h2><span class="note">TOP 7</span></div>
        <div class="tracks" id="topTracks"></div>
      </section>

      <section class="card panel" aria-label="单曲循环">
        <div class="phead"><h2>单曲循环榜</h2><span class="note">第一</span></div>
        <div id="loopBox"></div>
      </section>
    </div>

    <div class="grid2b">
      <section class="card panel" aria-label="这一周你">
        <div class="phead"><h2>这一周，你</h2><span class="note">按听歌记录生成</span></div>
        <div class="wtext" id="weekText"></div>
      </section>

      <section class="card panel" aria-label="每日收听">
        <div class="phead"><h2>每日收听</h2><span class="note">单位：分钟</span></div>
        <div class="daychart" id="dayChart"></div>
        <div class="daxis" id="dayAxis"></div>
        <div class="dayfoot">
          <span id="peakNote">峰值 —</span>
          <span id="windowNote">常听时段 —</span>
        </div>
      </section>
    </div>

    <div class="foot">
      <span id="footSource">数据来源：本机播放历史</span> · 仅在本机生成，不上传<br>
      <span id="footBackfill"></span>
    </div>
  </main>

  <section class="empty" id="empty" hidden>
    <div class="glyph">♪</div>
    <h2>这一周还没怎么听歌</h2>
    <p>播放记录几乎是空的，周报还写不出来。先去面板放几首，下周再来看。</p>
    <a class="btn" href="__BASE__/panel">去听歌</a>
  </section>
</div>

<div class="toast" id="toast" role="status" hidden></div>

<script>
(function(){
  'use strict';

  var state = { week:'this', report:null, loading:false };

  function $(sel, root){ return (root || document).querySelector(sel); }
  function el(tag, cls, text){
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined && text !== null) n.textContent = String(text);
    return n;
  }
  function num(v){ return typeof v === 'number' && isFinite(v) ? v : 0; }
  function fmt(v, digits){
    var n = typeof v === 'number' && isFinite(v) ? v : 0;
    var d = digits === undefined ? 1 : digits;
    var p = Math.pow(10, d);
    return String(Math.round(n * p) / p);
  }
  function setValue(node, value, unit){
    node.textContent = '';
    node.appendChild(document.createTextNode(value));
    if (unit) node.appendChild(el('small', null, unit));
  }

  var toastTimer = null;
  function toast(msg){
    var t = $('#toast');
    t.textContent = msg;
    t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.hidden = true; }, 3000);
  }

  function setBusy(on){
    state.loading = on;
    var btns = document.querySelectorAll('#topright [data-week], #share');
    for (var i = 0; i < btns.length; i++) btns[i].disabled = on;
    if (on) $('#share').disabled = true;
  }
  function showError(msg){
    $('#errorMsg').textContent = msg || '加载失败，请重试';
    $('#error').hidden = false;
  }
  function hideError(){ $('#error').hidden = true; }

  async function request(url, options){
    var init = options || {};
    init.headers = Object.assign({}, init.headers || {});
    if (init.body && !init.headers['Content-Type']) init.headers['Content-Type'] = 'application/json';
    var res = await fetch(url, init);
    var data = null;
    try { data = await res.json(); } catch (e) { data = null; }
    if (!res.ok) {
      var msg = (data && data.error) || ('请求失败（' + res.status + '）');
      var err = new Error(msg);
      err.status = res.status;
      err.code = data && data.code;
      throw err;
    }
    return data;
  }

  async function load(week){
    if (state.loading) return;
    hideError();
    setBusy(true);
    if (!state.report) $('#loading').hidden = false;
    try {
      var data = await request('__BASE__/api/report?week=' + encodeURIComponent(week));
      var report = data && data.report;
      if (!report) throw new Error('服务端没有返回周报数据');
      state.report = report;
      render(report);
    } catch (err) {
      showError(err && err.message ? err.message : '加载失败，请重试');
      if (!state.report) $('#loading').hidden = true;
    } finally {
      setBusy(false);
      $('#loading').hidden = true;
      $('#share').disabled = !state.report;
    }
  }

  function isEmptyReport(r){
    var m = r && r.metrics;
    if (!m) return true;
    return num(m.plays) === 0 && num(m.hours) === 0 && num(m.tracks) === 0;
  }

  function render(r){
    $('#loading').hidden = true;
    var m = r.metrics || {};
    var week = r.week || {};
    var label = week.label || (state.week === 'this' ? '本周' : '上周');
    $('#sub').textContent = label + (r.text ? ' · 已经写好了' : '');
    if (isEmptyReport(r)) {
      $('#content').hidden = true;
      $('#empty').hidden = false;
      return;
    }
    $('#empty').hidden = true;
    $('#content').hidden = false;

    var compare = r.compare || null;

    setValue($('#statHours'), fmt(num(m.hours), 1), '小时');
    var hoursDelta = deltaNode($('#deltaHours'), compare ? compare.hours : null, {
      unit: '小时', digits: 1, goodWhen: 'up', flatText: '与上一周基本持平'
    });
    if (hoursDelta === 'none') $('#deltaHours').textContent = '上一周还没有数据可对比';

    setValue($('#statTracks'), String(Math.round(num(m.tracks))), '首');
    $('#deltaTracks').textContent = '平均每天 ' + fmt(num(m.tracks) / 7, 1) + ' 首';
    $('#deltaTracks').className = 'd';

    setValue($('#statNew'), String(Math.round(num(m.newTracks))), '首');
    var newDelta = deltaNode($('#deltaNew'), compare ? compare.newTracks : null, {
      unit: '首', digits: 0, goodWhen: 'up', flatText: '与上一周一样多'
    });
    if (newDelta === 'none') $('#deltaNew').textContent = '上一周还没有数据可对比';

    setValue($('#statSkip'), fmt(num(m.skipRate), 1), '%');
    var skipDelta = deltaNode($('#deltaSkip'), compare ? compare.skipRate : null, {
      unit: '%', digits: 1, goodWhen: 'down', flatText: '与上一周持平'
    });
    if (skipDelta === 'none') $('#deltaSkip').textContent = '上一周还没有数据可对比';

    renderTopTracks(r.topTracks);
    renderLoop(r.loop);
    renderText(r.text, r);
    renderDaily(r);
    renderSource(r.dataSource || r.source);

    var backfill = Math.round(num(m.backfilled));
    $('#footBackfill').textContent = backfill > 0 ? ('其中 ' + backfill + ' 次为补记') : '';
  }

  function deltaNode(node, diff, opts){
    if (diff === null || diff === undefined || !isFinite(Number(diff))) return 'none';
    var v = Number(diff);
    node.className = 'd';
    var abs = Math.abs(v);
    if (Math.abs(v) < (opts.digits === 0 ? 0.5 : 0.05)) {
      node.textContent = opts.flatText || '与上一周持平';
      return 'flat';
    }
    var up = v > 0;
    node.textContent = '比上一周' + (up ? '多 ' : '少 ') + fmt(abs, opts.digits) + ' ' + (opts.unit === '%' ? '个百分点' : opts.unit);
    var better = opts.goodWhen === 'up' ? up : !up;
    node.className = 'd ' + (better ? 'good' : 'bad');
    return up ? 'up' : 'down';
  }

  function coverNode(track, cls){
    var box = el('div', 'cover' + (cls ? ' ' + cls : ''));
    var pic = track && track.picUrl;
    if (pic) {
      var img = document.createElement('img');
      img.alt = '';
      img.loading = 'lazy';
      img.src = pic;
      img.addEventListener('error', function(){ img.remove(); });
      box.appendChild(img);
    }
    return box;
  }

  function renderTopTracks(list){
    var box = $('#topTracks');
    box.textContent = '';
    var items = Array.isArray(list) ? list.slice(0, 7) : [];
    items = items.filter(function(x){ return x && x.track; });
    if (!items.length) {
      box.appendChild(el('div', 'hint', '这一周还没有反复听的歌。'));
      return;
    }
    items.forEach(function(item, i){
      var row = el('div', 'trow');
      row.appendChild(el('span', 'ix', String(i + 1)));
      row.appendChild(coverNode(item.track));
      var meta = el('div', 'tmeta');
      meta.appendChild(el('div', 'tname', item.track.name || '未知歌曲'));
      var artists = Array.isArray(item.track.artists) ? item.track.artists.filter(Boolean).join(' / ') : '';
      meta.appendChild(el('div', 'tartist', artists || '未知艺人'));
      row.appendChild(meta);
      var plays = el('div', 'tplays');
      plays.appendChild(el('b', null, String(Math.round(num(item.plays)))));
      plays.appendChild(document.createTextNode(' 次'));
      row.appendChild(plays);
      box.appendChild(row);
    });
  }

  function renderLoop(loop){
    var box = $('#loopBox');
    box.textContent = '';
    if (!loop || !loop.track) {
      box.appendChild(el('div', 'loop-empty', '这一周没有哪首歌被你反复按播放。'));
      return;
    }
    var top = el('div', 'loop-top');
    top.appendChild(coverNode(loop.track, 'loop-cover'));
    var plays = el('div');
    var line = el('div');
    var n = el('span', 'loop-num', String(Math.round(num(loop.plays))));
    line.appendChild(n);
    line.appendChild(el('span', 'loop-unit', '遍'));
    plays.appendChild(line);
    top.appendChild(plays);
    box.appendChild(top);
    box.appendChild(el('div', 'loop-song', loop.track.name || '未知歌曲'));
    var artists = Array.isArray(loop.track.artists) ? loop.track.artists.filter(Boolean).join(' / ') : '';
    box.appendChild(el('div', 'loop-artist', artists || '未知艺人'));
    if (loop.story) {
      var story = el('p', 'loop-story');
      story.textContent = '「' + loop.story + '」';
      box.appendChild(story);
    }
  }

  function decorate(host, text){
    var re = /(《[^》]{1,40}》|\d+(?:\.\d+)?%?|周[一二三四五六日天]|凌晨|深夜|单曲循环)/g;
    var parts = String(text).split(re);
    for (var i = 0; i < parts.length; i++) {
      var part = parts[i];
      if (!part) continue;
      if (re.test(part)) {
        re.lastIndex = 0;
        if (part.charAt(0) === '《') host.appendChild(el('b', null, part));
        else host.appendChild(el('i', null, part));
      } else {
        host.appendChild(document.createTextNode(part));
      }
    }
  }

  function renderSource(ds){
    var node = $('#footSource');
    if (!node) return;
    var data = ds && typeof ds === 'object' ? ds : null;
    var label = data && data.label ? data.label : '本机播放历史';
    node.textContent = '数据来源：' + label + (data && data.note ? '（' + data.note + '）' : '');
  }

  function renderText(text, report){
    var box = $('#weekText');
    box.textContent = '';
    var value = String(text || '').trim();
    if (!value) {
      box.appendChild(el('p', 'hint', '这一周还算安静，没有可以写下来的故事。'));
      return;
    }
    /* 后端 reportText 用 peakDay.hours / 单字 label 拼句子，页面按真实字段补齐：
       undefined 小时 → peakDay 分钟换算；三是你的峰值 → 周三是你的峰值。 */
    var peak = report && report.peakDay;
    if (peak && peak.label !== undefined && peak.label !== null) {
      var peakHours = peak.hours !== undefined && peak.hours !== null
        ? fmt(num(peak.hours), 1)
        : fmt(num(peak.minutes) / 60, 1);
      value = value.replace(/undefined\s*小时/g, peakHours + ' 小时');
    }
    /* reportText 把 daily.label 的单字（一/二/…）直接拼进句子，如「三是你的峰值」 */
    value = value.replace(/([一二三四五六日])是你的峰值/g, '周$1是你的峰值');
    value = value.replace(/undefined/g, '—');
    var sentences = value.split('。').map(function(s){ return s.trim(); }).filter(Boolean);
    if (!sentences.length) sentences = [value];
    sentences.forEach(function(sentence){
      var p = document.createElement('p');
      decorate(p, sentence + '。');
      box.appendChild(p);
    });
  }

  function renderDaily(r){
    var chart = $('#dayChart');
    var axis = $('#dayAxis');
    chart.textContent = '';
    axis.textContent = '';
    var days = Array.isArray(r.daily) ? r.daily.slice(0, 7) : [];
    if (!days.length) { chart.appendChild(el('div', 'hint', '没有每日数据。')); return; }
    var max = 0;
    days.forEach(function(d){ max = Math.max(max, num(d.minutes)); });
    var peakIdx = -1;
    days.forEach(function(d, i){ if (num(d.minutes) === max && max > 0 && peakIdx < 0) peakIdx = i; });
    days.forEach(function(d, i){
      var col = el('div', 'dcol');
      var minutes = num(d.minutes);
      var val = el('div', 'dval', minutes > 0 ? (minutes >= 60 ? fmt(minutes / 60, 1) + 'h' : Math.round(minutes) + 'm') : '');
      col.appendChild(val);
      var bar = el('div', 'dbar' + (i === peakIdx ? ' hot' : (minutes <= 0 ? ' zero' : '')));
      var h = max > 0 ? Math.max(minutes > 0 ? 3 : 4, Math.round((minutes / max) * 96)) : 4;
      bar.style.height = h + 'px';
      bar.title = (d.label || ('周' + (i + 1))) + ' · ' + Math.round(minutes) + ' 分钟';
      col.appendChild(bar);
      chart.appendChild(col);
      axis.appendChild(el('span', null, d.label || ['一','二','三','四','五','六','日'][i]));
    });
    var peak = r.peakDay;
    if (peak && peak.label) {
      var peakLabel = String(peak.label);
      if (peakLabel.length <= 1) peakLabel = '周' + peakLabel;
      var peakHours = peak.hours !== undefined && peak.hours !== null
        ? num(peak.hours)
        : num(peak.minutes) / 60;
      $('#peakNote').textContent = '';
      $('#peakNote').appendChild(document.createTextNode('峰值 '));
      $('#peakNote').appendChild(el('b', null, peakLabel));
      $('#peakNote').appendChild(document.createTextNode(' · ' + fmt(peakHours, 1) + ' 小时'));
    } else {
      $('#peakNote').textContent = '峰值 这一周没有明显高峰';
    }
    var win = r.listeningWindow;
    if (win && win.label) {
      $('#windowNote').textContent = '';
      $('#windowNote').appendChild(document.createTextNode('常听时段 '));
      $('#windowNote').appendChild(el('b', null, win.label));
    } else {
      $('#windowNote').textContent = '常听时段 还不够明显';
    }
  }

  function buildShareText(r){
    var m = r.metrics || {};
    var week = r.week || {};
    var lines = [];
    lines.push('《听歌周报》' + (week.label || ''));
    lines.push('听歌 ' + fmt(num(m.hours), 1) + ' 小时 · 曲目 ' + Math.round(num(m.tracks)) + ' 首 · 新歌 ' + Math.round(num(m.newTracks)) + ' 首 · 跳过率 ' + fmt(num(m.skipRate), 1) + '%');
    var tops = Array.isArray(r.topTracks) ? r.topTracks.slice(0, 7) : [];
    if (tops.length) {
      lines.push('本周最爱：');
      tops.forEach(function(item, i){
        var t = item.track || {};
        var artists = Array.isArray(t.artists) ? t.artists.filter(Boolean).join(' / ') : '';
        lines.push((i + 1) + '. ' + (t.name || '未知歌曲') + (artists ? ' — ' + artists : '') + '（' + Math.round(num(item.plays)) + ' 次）');
      });
    }
    if (r.loop && r.loop.track) {
      var lt = r.loop.track;
      var la = Array.isArray(lt.artists) ? lt.artists.filter(Boolean).join(' / ') : '';
      lines.push('单曲循环：' + (lt.name || '未知歌曲') + (la ? ' — ' + la : '') + '（' + Math.round(num(r.loop.plays)) + ' 遍）');
    }
    if (r.text) lines.push('这一周，你：' + r.text);
    lines.push('数据来自网易云听歌记录与本机播放历史，仅在本机生成。');
    return lines.join('\n');
  }

  async function copyText(text){
    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
        return true;
      }
    } catch (e) { /* fall through */ }
    try {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', 'readonly');
      ta.style.position = 'fixed';
      ta.style.top = '-1000px';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      var ok = document.execCommand('copy');
      ta.remove();
      return ok;
    } catch (e) {
      return false;
    }
  }

  /* ---------- events ---------- */
  (function bind(){
    var top = document.querySelector('.topright');
    top.addEventListener('click', function(ev){
      var btn = ev.target.closest('[data-week]');
      if (!btn || state.loading) return;
      var week = btn.getAttribute('data-week');
      if (week === state.week && state.report) return;
      state.week = week;
      updateWeekChips();
      load(week);
    });
    $('#retry').addEventListener('click', function(){
      if (state.loading) return;
      load(state.week);
    });
    $('#share').addEventListener('click', async function(){
      if (!state.report || state.loading) return;
      var btn = $('#share');
      btn.disabled = true;
      var ok = await copyText(buildShareText(state.report));
      btn.disabled = false;
      toast(ok ? '周报文案已复制，去粘贴吧' : '复制失败，请手动选择文本');
    });
  })();

  function updateWeekChips(){
    var chips = document.querySelectorAll('#topright [data-week]');
    for (var i = 0; i < chips.length; i++) {
      chips[i].classList.toggle('on', chips[i].getAttribute('data-week') === state.week);
    }
  }

  updateWeekChips();
  load(state.week);
})();
</script>
